[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wqb-cli"
version = "0.3.1"
description = "Agent-first WorldQuant BRAIN API CLI with bundled API inventory and command documentation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "wiz" },
]
license = { file = "LICENSE" }
dependencies = [
    "jsonschema>=4.23",
    "keyring>=24",
    "msgpack>=1.0",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.scripts]
wqb = "wqb_cli.cli:main"

[project.urls]
Repository = "https://github.com/untuitivist/wqb_cli"
Author = "https://github.com/untuitivist"

[tool.setuptools]
packages = ["wqb_cli", "wqb_cli.agent", "wqb_cli.agent.models", "wqb_cli.agent.nodes", "wqb_cli.commands", "wqb_cli.core"]

[tool.setuptools.package-dir]
wqb_cli = "."

[tool.setuptools.package-data]
wqb_cli = [
    "resources/api_inventory/**/*.json",
    "resources/api_inventory/**/*.md",
    "resources/api_inventory/**/*.txt",
    "resources/api_inventory/**/*.html",
    "resources/docs/**/*.md",
    "resources/docs/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
