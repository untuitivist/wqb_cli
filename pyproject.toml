[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wqb-cli"
version = "0.6.3"
description = "Agent-first WorldQuant BRAIN CLI with durable batch simulations and template-family workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "wiz" },
]
license = { file = "LICENSE" }
dependencies = [
    "keyring>=24",
    "msgpack>=1.2.1",
    "packaging>=24",
    "pandas>=2.0",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "jaraco.context>=6.1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["build>=1.2", "setuptools>=78.1.1", "wheel>=0.45.1", "pytest>=8", "pip-audit>=2.7"]

[project.scripts]
wqb = "wqb_cli.cli:main"

[project.urls]
Repository = "https://github.com/untuitivist/wqb_cli"
Author = "https://github.com/untuitivist"

[tool.setuptools]
packages = ["wqb_cli", "wqb_cli.commands", "wqb_cli.core", "wqb_cli.sqlitesimu"]
include-package-data = false

[tool.setuptools.package-dir]
wqb_cli = "."

[tool.setuptools.package-data]
wqb_cli = [
    "resources/api_inventory/**/*.json",
    "resources/api_inventory/**/*.md",
    "resources/api_inventory/**/*.txt",
    "resources/api_inventory/**/*.html",
    "resources/community_api/**/*.json",
    "resources/community_api/**/*.md",
    "resources/help_center_api/**/*.json",
    "resources/help_center_api/**/*.md",
    "resources/docs/**/*.md",
    "resources/docs/**/*.json",
    "resources/docs/**/*.sql",
    "workflows/*.md",
    "workflows/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
